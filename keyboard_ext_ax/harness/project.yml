name: KeyboardExtAX
options:
  bundleIdPrefix: dev.keyboardextax
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  KeyboardExtAXHost:
    type: application
    platform: iOS
    sources:
      - Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.keyboardextax.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  KeyboardExtAXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KeyboardExtAXHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.keyboardextax.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KeyboardExtAXHost
        CODE_SIGNING_ALLOWED: NO
schemes:
  KeyboardExtAX:
    build:
      targets:
        KeyboardExtAXHost: all
        KeyboardExtAXUITests:
          - test
    test:
      targets:
        - name: KeyboardExtAXUITests
          parallelizable: false
