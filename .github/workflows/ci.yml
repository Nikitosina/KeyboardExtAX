name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and packaging tools
        run: python -m pip install --upgrade pip build twine .

      - name: Run tests
        run: python -m unittest discover -s Tests -v

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Verify bundled XCTest harness
        run: |
          unzip -l dist/*.whl | grep 'keyboard_ext_ax/harness/UITests/PersistentKeyboardExtAXTests.swift'
          tar -tf dist/*.tar.gz | grep 'keyboard_ext_ax/harness/UITests/PersistentKeyboardExtAXTests.swift'

      - name: Smoke-test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -c 'from keyboard_ext_ax.controller import KeyboardExtAXController; c = KeyboardExtAXController(cache_dir="wheel-cache"); assert (c.project_root / "KeyboardExtAX.xcodeproj").is_dir()'
          "$RUNNER_TEMP/wheel-test/bin/keyboard-ext-ax" --help
          "$RUNNER_TEMP/wheel-test/bin/keyboard-ext-ax-mcp" </dev/null
